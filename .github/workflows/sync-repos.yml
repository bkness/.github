name: Sync Repos

# Keeps every non-archived bkness repo on the same settings: squash-only
# merges, delete branch on merge, Dependabot alerts + security PRs, secret
# scanning (public repos), and adds missing shared labels (repos pushed in
# the last year). Only changes what drifted. Logic: .github/scripts/sync-repos.js
#
# SYNC_TOKEN: fine-grained token, All repositories,
# Administration + Issues: Read and write

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: list what would change, change nothing"
        type: boolean
        default: true
  schedule:
    - cron: "0 14 * * 1"   # Mondays, catches repos created during the week

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/github-script@v9
        env:
          # Scheduled runs have no inputs, so they apply for real
          DRY_RUN: ${{ inputs.dry_run == true }}
        with:
          github-token: ${{ secrets.SYNC_TOKEN }}
          script: |
            const sync = require('./.github/scripts/sync-repos.js');
            await sync({ github, core, dryRun: process.env.DRY_RUN === 'true' });
